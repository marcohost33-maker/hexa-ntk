# .pre-commit-config.yaml — HexaNTK
#
# Faengt Defekte VOR dem Push (statt erst in CI). Installation:
#   pip install pre-commit && pre-commit install
#
# WICHTIG (Version-Drift): die ruff `rev` MUSS mit dem ruff-Pin in
# requirements-dev.txt synchron bleiben. CI installiert den Ruff-CLI aus dem
# Dev-Manifest; pre-commit pinnt Hook-Repos ueber `rev`.
# Bei Ruff-Upgrade: requirements-dev.txt + diese `rev` gemeinsam anheben.
# Dependabot ueberwacht sowohl pip (`requirements-dev.txt`) als auch pre-commit.

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      # Lint-only (Paritaet mit CI `ruff check`); --fix darf autofixen.
      # Bewusst KEIN ruff-format: die gehaerteten Module sind nicht ruff-format-
      # konform und werden nicht ungeprueft reformatiert (Reality-Anchor). Format
      # waere ein separater, lokal per torch-Selftest verifizierter Schritt.
      - id: ruff
        args: [--fix]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=2048]
      # AGENTS.md §Don't: keine Secrets/Keys ins Repo.
      - id: detect-private-key
