# Dependabot - github-actions only (kein Python-Manifest im Repo; pip-Block erst
# wenn pyproject/requirements landet - Schema-Lehre aza-backend PR#14).
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Zurich"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      actions-minor-and-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
      actions-security:
        applies-to: security-updates
        patterns: ["*"]
    labels: ["dependencies", "github-actions"]
