name: stateful-loader-evidence

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  stateful-loader-cpu:
    name: stateful-loader-cpu
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        num-workers: [0, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: install pinned recovery stack
        run: |
          python -m pip install --upgrade pip
          pip install "numpy==2.5.3" "torchdata==0.11.0"
          pip install "torch==2.6.0" --index-url https://download.pytorch.org/whl/cpu
      - name: environment evidence
        run: |
          python --version
          python - <<'PY'
          import numpy
          import torch
          import torchdata
          print("numpy", numpy.__version__)
          print("torch", torch.__version__)
          print("torchdata", torchdata.__version__)
          PY
      - name: StatefulDataLoader differential oracle
        run: |
          python scripts/oracles/stateful_loader_resume_oracle.py \
            --num-workers ${{ matrix.num-workers }} \
            --output stateful-loader-${{ matrix.num-workers }}.json
