# zizmor — static analysis for GitHub Actions workflows
# Docs: https://docs.zizmor.sh + https://github.com/zizmorcore/zizmor-action
name: Workflow Security Audit (zizmor)

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/**"
      - ".github/dependabot.yml"
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/dependabot.yml"
  schedule:
    - cron: "13 6 * * 1"  # Mondays 06:13 UTC

permissions: {}

jobs:
  zizmor:
    name: zizmor workflow audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # SARIF upload (no-op on private without GHAS)
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Run zizmor
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b  # v0.8.0
        with:
          persona: regular
          advanced-security: false
          annotations: true

