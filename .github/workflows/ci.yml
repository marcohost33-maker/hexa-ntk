name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt   # zentrale Pins: ruff/coverage
      - name: ruff
        run: ruff check src scripts   # blocking; Konfig in pyproject.toml, Engine seit 2026-10-27 im Gate
      - name: compile
        run: python -m compileall src
      - name: provenance (SOURCES.md)
        # fail-closed: jedes Toolkit-Modul braucht einen SOURCES.md-Eintrag,
        # jeder Eintrag muss zur aktuellen Datei passen (SHA-256, LF-normalisiert).
        run: python scripts/verify_sources.py
      - name: required GINO forward+backward+optimizer smoke when adapter is present
        # Runs on stacked PRs too; never count an optional-backend skip as success.
        # The phase1-adapter-checks workflow alone is not the protected ci/gate.
        run: |
          if [ -f src/toolkit/gino_adapter_hex_v3.py ]; then
            pip install numpy
            pip install "torch==2.6.0" --index-url https://download.pytorch.org/whl/cpu
            pip install -r requirements-operator.txt
            python -c "import importlib.metadata; assert importlib.metadata.version('neuraloperator') == '2.0.0'"
            python -c "import neuralop.models; assert hasattr(neuralop.models, 'GINO')"
            python -m unittest discover -s src/toolkit -t src/toolkit -p "test_gino_adapter_hex_v3.py" -v
          fi

  tests:
    name: tests (cpu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          # requirements-dev.txt ist kein setup-python Default-Manifestname;
          # deshalb explizit in den Cache-Key aufnehmen.
          cache-dependency-path: requirements-dev.txt
      - name: install (cpu-only torch)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt   # zentrale Pins: ruff/coverage
          # gepinnt wie die Evidence-Lanes (distributed-checkpoint, stateful-loader):
          # ein ungepinntes numpy aenderte die CI ohne Commit (ROADMAP).
          pip install "numpy==2.5.3"
          # CPU-Wheel ueber den dedizierten Index (kleiner, kein CUDA-Ballast);
          # torch 2.6.0 = vom Engine-Header geforderte SoTA-Baseline.
          pip install "torch==2.6.0" --index-url https://download.pytorch.org/whl/cpu
      - name: engine doctests + selftests
        # Wrapper statt `python src/hexantk_v3.py`: letzteres exitet immer 0
        # (Rueckgabewert ungenutzt). engine_gate.py exitet != 0 bei Fehlern.
        run: python scripts/engine_gate.py
      - name: toolkit unit tests + coverage
        # Lauf vom Repo-Root, damit [tool.coverage.*] aus pyproject.toml greift
        # (coverage.py liest Konfig nur aus dem CWD). -t src/toolkit haelt die
        # bare imports der Module intakt (wie vorher Discovery aus src/toolkit).
        run: |
          python -m coverage run -m unittest discover -s src/toolkit -t src/toolkit -p "test_*.py" -v
          python -m coverage report   # blocking: fail_under in pyproject.toml
      - name: FV solver + reference case across OpenBLAS kernels
        # The CG stopping-rule tests depend on the rounding of BLAS ddot, whose
        # summation order is chosen per OpenBLAS kernel: PR #61 head 6d219d9
        # was green on SkylakeX and red on the CI runner, as with the
        # Haswell/Zen/Prescott kernels. Re-run the torch-free FV/reference
        # suites under every portable kernel (and
        # SkylakeX where AVX-512 exists) so a kernel-dependent premise fails
        # here instead of on the next runner generation.
        working-directory: src/toolkit
        run: |
          kernels="Prescott Sandybridge Haswell Zen"
          # SkylakeX kernels need AVX-512 F/BW/DQ/VL; add it only where all exist.
          if grep -qw avx512f /proc/cpuinfo && grep -qw avx512bw /proc/cpuinfo \
             && grep -qw avx512dq /proc/cpuinfo && grep -qw avx512vl /proc/cpuinfo; then
            kernels="$kernels SkylakeX"
          fi
          for kernel in $kernels; do
            echo "== OPENBLAS_CORETYPE=$kernel"
            OPENBLAS_CORETYPE="$kernel" python -m unittest test_hex_fv_solver_hex_v3 test_reference_case_hex_v3
          done
