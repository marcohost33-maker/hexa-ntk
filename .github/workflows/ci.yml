name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt   # zentrale Pins: ruff/coverage
      - name: ruff
        run: ruff check src scripts   # blocking; Konfig + Engine-Exclude in pyproject.toml
      - name: compile
        run: python -m compileall src
      - name: provenance (SOURCES.md)
        # fail-closed: jedes Toolkit-Modul braucht einen SOURCES.md-Eintrag,
        # jeder Eintrag muss zur aktuellen Datei passen (SHA-256, LF-normalisiert).
        run: python scripts/verify_sources.py
      - name: required real GINO forward gate when adapter is present
        # Runs on stacked PRs too; never count an optional-backend skip as success.
        # The phase1-adapter-checks workflow alone is not the protected ci/gate.
        run: |
          if [ -f src/toolkit/gino_adapter_hex_v3.py ]; then
            pip install numpy
            pip install "torch==2.6.0" --index-url https://download.pytorch.org/whl/cpu
            pip install -r requirements-operator.txt
            python -c "import importlib.metadata; assert importlib.metadata.version('neuraloperator') == '2.0.0'"
            python -c "import neuralop.models; assert hasattr(neuralop.models, 'GINO')"
            python -m unittest discover -s src/toolkit -t src/toolkit -p "test_gino_adapter_hex_v3.py" -v
          fi

  tests:
    name: tests (cpu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          # requirements-dev.txt ist kein setup-python Default-Manifestname;
          # deshalb explizit in den Cache-Key aufnehmen.
          cache-dependency-path: requirements-dev.txt
      - name: install (cpu-only torch)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt   # zentrale Pins: ruff/coverage
          pip install numpy
          # CPU-Wheel ueber den dedizierten Index (kleiner, kein CUDA-Ballast);
          # torch 2.6.0 = vom Engine-Header geforderte SoTA-Baseline.
          pip install "torch==2.6.0" --index-url https://download.pytorch.org/whl/cpu
      - name: engine doctests + selftests
        # Wrapper statt `python src/hexantk_v3.py`: letzteres exitet immer 0
        # (Rueckgabewert ungenutzt). engine_gate.py exitet != 0 bei Fehlern.
        run: python scripts/engine_gate.py
      - name: toolkit unit tests + coverage
        # Lauf vom Repo-Root, damit [tool.coverage.*] aus pyproject.toml greift
        # (coverage.py liest Konfig nur aus dem CWD). -t src/toolkit haelt die
        # bare imports der Module intakt (wie vorher Discovery aus src/toolkit).
        run: |
          python -m coverage run -m unittest discover -s src/toolkit -t src/toolkit -p "test_*.py" -v
          python -m coverage report   # blocking: fail_under in pyproject.toml
