name: phase1-adapter-checks

on:
  pull_request:
    paths:
      - "src/**"
      - "spec/**"
      - "scripts/**"
      - "README.md"
      - "SOURCES.md"
      - "requirements-operator.txt"
      - "requirements-dev.txt"
      - "pyproject.toml"
      - ".github/workflows/gino-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    name: stacked gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: ruff
        run: ruff check src scripts
      - name: compile
        run: python -m compileall src
      - name: provenance
        run: python scripts/verify_sources.py

  tests:
    name: stacked tests (cpu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: install core
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install numpy
          pip install "torch==2.6.0" --index-url https://download.pytorch.org/whl/cpu
      - name: engine doctests + selftests
        run: python scripts/engine_gate.py
      - name: toolkit unit tests + coverage
        run: |
          python -m coverage run -m unittest discover -s src/toolkit -t src/toolkit -p "test_*.py" -v
          python -m coverage report

  gino-smoke:
    name: real GINO forward and synthetic backward optimizer smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-operator.txt
      - name: install optional backend
        run: |
          python -m pip install --upgrade pip
          pip install numpy
          pip install "torch==2.6.0" --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-operator.txt
      - name: real GINO forward and synthetic backward optimizer smoke
        run: python -m unittest discover -s src/toolkit -t src/toolkit -p "test_gino_adapter_hex_v3.py" -v
