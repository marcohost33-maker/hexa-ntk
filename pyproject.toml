# pyproject.toml — HexaNTK
#
# Zweck: Single source of truth fuer die Ruff-Lint-Konfiguration, damit CI und
# lokaler Lauf identisch sind (Ruff liest [tool.ruff] automatisch hoch bis zum
# Workspace-Root). Kein Build-/Packaging-Setup — dies ist ein Forschungs-Repo,
# kein distributierbares Paket (AGENTS.md §Project).
#
# Lint-Baseline gesetzt 2026-06-18 (vorher CI = `ruff check src || true`,
# non-blocking). Enforced rule-set bewusst eng (E/F/W = pyflakes + pycodestyle):
# faengt echte Defekte (unused imports/vars, redefinitions) ohne grossflaechige,
# hier nicht per torch-Test verifizierbare Stil-/Typing-Umschreibungen.

[tool.ruff]
target-version = "py312"
line-length = 120

# Engine: src/hexantk_v3.py war bis 2026-10-27 per extend-exclude vom Lint-Gate
# ausgenommen, solange offen war, wo sie gepflegt wird. Issue #74 hat das
# entschieden: dieses Repo ist kanonisch, Engine-Aenderungen entstehen hier und
# werden nach coworker-dde gespiegelt (AGENTS.md §Project). Damit gehoert sie ins
# Gate (Gesamtbericht 2026-10-27, HXB-09). Sie war schon vorher clean (ruff 0.17.0,
# E/F/W, 0 Befunde @c5f5072), die Aufnahme aendert keine Engine-Bytes.
# test_hex_timestep_contract.TestDocsContract.test_engine_is_inside_the_lint_gate
# haelt das fest.

[tool.ruff.lint]
select = ["E", "F", "W"]

# Coverage-Gate (ROADMAP "Coverage messen", umgesetzt 2026-07-03). Lauf vom
# Repo-Root (coverage.py sucht Konfig nur im CWD, nicht aufwaerts):
#   python -m coverage run -m unittest discover -s src/toolkit -t src/toolkit -p "test_*.py"
#   python -m coverage report
# Branch-Coverage als ehrlichere Metrik (Scientific-Python-Guide). Nur die hier
# gepflegten Toolkit-Module zaehlen; die Engine src/hexantk_v3.py zaehlt nicht in
# diese Schwelle (ihre Abdeckung durch das Engine-Gate, 49 Doctests + 26 Selftests,
# und durch Toolkit-Tests, die sie per Pfad laden, wird separat gemessen und
# berichtet: README "Engine-Abdeckung"; ob sie ein eigenes Gate bekommt, ist offen).
[tool.coverage.run]
branch = true
source = ["src/toolkit"]

[tool.coverage.report]
# Testfiles selbst zaehlen nicht als abzudeckender Code.
omit = ["*/test_*.py"]
# Ratchet-Schwelle: Ist-Wert 89.6% (verified 2026-09-27 nach warmstart/ema/
# resume-Tests, results/2026-09-27_review-hardening_local-gate.log; vorher 82-83%
# bei fail_under 79), Schwelle knapp darunter — Best Practice: unter Ist setzen
# und mit neuen Tests hochziehen, nie ueber Ist wuenschen (Gate darf nicht durch
# Absenken erschlichen werden). Zielkorridor: 80-90% (docs/ROADMAP.md).
fail_under = 87
