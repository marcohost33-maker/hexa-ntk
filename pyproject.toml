# pyproject.toml — HexaNTK
#
# Zweck: Single source of truth fuer die Ruff-Lint-Konfiguration, damit CI und
# lokaler Lauf identisch sind (Ruff liest [tool.ruff] automatisch hoch bis zum
# Workspace-Root). Kein Build-/Packaging-Setup — dies ist ein Forschungs-Repo,
# kein distributierbares Paket (AGENTS.md §Project).
#
# Lint-Baseline gesetzt 2026-06-18 (vorher CI = `ruff check src || true`,
# non-blocking). Enforced rule-set bewusst eng (E/F/W = pyflakes + pycodestyle):
# faengt echte Defekte (unused imports/vars, redefinitions) ohne grossflaechige,
# hier nicht per torch-Test verifizierbare Stil-/Typing-Umschreibungen.

[tool.ruff]
target-version = "py312"
line-length = 120

# Kanonische Engine: src/hexantk_v3.py ist byte-identisch mit coworker-dde/src
# (SOURCES.md, Equalita-Audit 2026-06-04). Aenderungen muessen dort und hier
# synchron bleiben (AGENTS.md §Project), darum wird sie hier NICHT lint-enforced
# — Best Practice: Code, den man nicht in diesem Repo pflegt, vom Lint-Gate
# ausnehmen (Ruff FAQ/docs). Aenderungen an der Engine laufen ueber coworker-dde.
extend-exclude = ["src/hexantk_v3.py"]

[tool.ruff.lint]
select = ["E", "F", "W"]

# Coverage-Gate (ROADMAP "Coverage messen", umgesetzt 2026-07-03). Lauf vom
# Repo-Root (coverage.py sucht Konfig nur im CWD, nicht aufwaerts):
#   python -m coverage run -m unittest discover -s src/toolkit -t src/toolkit -p "test_*.py"
#   python -m coverage report
# Branch-Coverage als ehrlichere Metrik (Scientific-Python-Guide). Nur die hier
# gepflegten Toolkit-Module zaehlen; die kanonische Engine src/hexantk_v3.py ist
# wie beim Lint-Gate ausgenommen (Pflege via coworker-dde), ihre Abdeckung
# liefert das Engine-Gate (47 Doctests + 26 Selftests) separat.
[tool.coverage.run]
branch = true
source = ["src/toolkit"]

[tool.coverage.report]
# Testfiles selbst zaehlen nicht als abzudeckender Code.
omit = ["*/test_*.py"]
# Umgebungsabhaengige Zweige, auf dem CPU-only-CI prinzipiell unerreichbar
# (coverage.py-Doku "Excluding code": exclude_also ergaenzt die Default-Regexes;
# ein Match auf einer if/except-Zeile schliesst die ganze Klausel aus):
# - CUDA-only-Bloecke (RNG-Save/Restore in resume_utils, empty_cache im Runner)
# - ImportError-Fallbacks fuer aeltere PyTorch-Versionen (warmstart_utils;
#   CI pinnt torch 2.6, der Import schlaegt dort nie fehl)
exclude_also = [
    "if torch\\.cuda\\.is_available\\(\\)",
    "except ImportError",
]
# Ratchet-Schwelle: Ist-Wert 94% (verified 2026-08-08 nach Runner-Tests 79->94%
# + exclude_also fuer CPU-CI-unerreichbare Zweige, results/), Schwelle knapp
# darunter — Best Practice: unter Ist setzen und mit neuen Tests hochziehen,
# nie ueber Ist wuenschen (Gate darf nicht durch Absenken erschlichen werden).
# Zielkorridor 80-90% (docs/ROADMAP.md) uebertroffen.
fail_under = 91
